name: Release

# Scorecard's Signed-Releases check said "no releases found": there was a git
# tag but no GitHub Release, and nothing signed. This builds the one artefact
# this project actually has to publish - the data - and signs it.
#
# The bundle is the point. The dashboard is a view; `docs/data/*.json` is the
# thing someone might cite, diff against a later version, or mirror. Shipping
# it as a signed, checksummed tarball means a third party can verify they are
# holding the same bytes this repository published.

on:
  push:
    tags: ['[0-9]*']          # CalVer: 2026.11.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (github.ref_name is a branch on manual runs)'
        required: true

permissions: {}

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write         # create the release and upload assets
      id-token: write         # keyless signing: the OIDC token IS the identity
      attestations: write     # build provenance

    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On a tag push this is the tag already. On a manual run GitHub would
          # otherwise hand us the default branch, so a re-run of a failed
          # release would quietly build main and label it with the tag's
          # version - publishing something that is not what the tag says it is.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: The data must be valid before it is published
        # A signature on a broken dataset just proves the break is authentic.
        run: |
          python3 agent/check.py
          # The recompute stamps today's date into derived.json, every gap's
          # `refreshed` and the "inventory updated" badge, while the tag holds
          # its own day. Hunks that are only those dates are ignored; anything
          # else is a real difference and refuses the release. validate.yml
          # pins the date with --as-of instead, but a manual run here releases
          # an older tag whose pipeline.py may predate that flag.
          python3 agent/pipeline.py --derive-only >/dev/null
          dates='^ *"(generated|refreshed)": "[0-9]{4}-[0-9]{2}-[0-9]{2}",?$'
          badge='aria-label="inventory updated: '
          paths="docs/data/derived.json docs/data/gaps.json docs/assets"
          if ! git diff --quiet -I "$dates" -I "$badge" -- $paths; then
            echo "::error::Derived data or badges are stale at this tag - refusing to release."
            git diff --stat -I "$dates" -I "$badge" -- $paths
            exit 1
          fi

      - name: Build the bundle
        id: bundle
        # Every ${{ }} here goes through env, never into the script text. A tag
        # is attacker-supplied on a workflow_dispatch run, and interpolation
        # happens BEFORE the shell sees the line - so a tag containing shell
        # metacharacters would execute as code on a runner holding a token with
        # contents:write. This is the same mistake that was fixed in
        # weekly-ingest.yml and reintroduced here; semgrep caught it.
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_INPUT:-$REF_NAME}"
          case "$version" in
            [0-9]*) ;;
            *) echo "::error::Refusing to release a version that is not CalVer: $version"; exit 1 ;;
          esac
          name="ai-security-research-inventory-${version}"
          mkdir -p "dist/${name}"
          cp -r docs/data "dist/${name}/data"
          cp CITATION.cff LICENSE README.md CHANGELOG.md INTERFACE.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -rf "dist/${name}"
          cd dist && sha256sum "${name}.tar.gz" > SHA256SUMS
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -l

      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Sign the bundle (keyless)
        # No private key to store, lose, or leak. The signing identity is this
        # workflow, in this repository, at this ref - recorded publicly in the
        # Rekor transparency log and verifiable by anyone with the command in
        # the release notes.
        env:
          COSIGN_YES: "true"
          NAME: ${{ steps.bundle.outputs.name }}
        run: |
          cd dist
          cosign sign-blob "${NAME}.tar.gz" \
            --output-signature "${NAME}.tar.gz.sig" \
            --output-certificate "${NAME}.tar.gz.pem"
          cosign sign-blob SHA256SUMS \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/${{ steps.bundle.outputs.name }}.tar.gz

      - name: Ship the provenance with the artefact
        # The action files the attestation with GitHub's API, which is fine if
        # you have the API. It is no use to someone holding the tarball on a
        # disconnected machine, and Scorecard's Signed-Releases check caps a
        # release at 8/10 until the provenance is downloadable beside it.
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          NAME: ${{ steps.bundle.outputs.name }}
        run: cp "$BUNDLE_PATH" "dist/${NAME}.intoto.jsonl"

      - name: Release notes from the changelog
        # The footer lives in its own file rather than a heredoc: markdown
        # inside a YAML block scalar is one stray column-1 '---' away from
        # silently becoming a second YAML document.
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          v="$VERSION"
          awk -v v="$v" '
            $0 == "## " v || index($0, "## " v " ") == 1 {f=1; next}
            f && /^## / {exit}
            f {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog section for $v." > notes.md
          fi
          sed "s/VERSION/$v/g" .github/release-notes-footer.md >> notes.md
          echo "--- notes.md ---"; cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file notes.md \
            dist/*.tar.gz dist/*.sig dist/*.pem dist/*.intoto.jsonl dist/SHA256SUMS
