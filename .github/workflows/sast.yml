name: SAST

# Semgrep runs from its own digest-pinned image, NOT pip-installed.
#
# Hash-pinning `pip install semgrep` satisfied Scorecard's pinned-dependencies
# check and then did something worse: it wrote semgrep's 66-package transitive
# closure into this repo's dependency graph, where Dependabot correctly flagged
# CVEs in mcp and opentelemetry-api. Those are the security scanner's own
# dependencies, not this project's - nothing here imports them, and they are
# not part of what ships. A container keeps the scanner's supply chain out of
# the repo's, and a digest is a stronger pin than a hash list anyway.
#
# Semgrep, not CodeQL. The repo uses CodeQL *default setup* (configured in
# repo settings), which scans Python and Actions but cannot coexist with a
# CodeQL workflow - default setup rejects an advanced workflow's upload. That
# leaves two holes this fills:
#
#   1. docs/app.js is ~1,600 lines rendering text the agent fetched off the open
#      internet, and default setup's language list does not include JavaScript.
#   2. OpenSSF Scorecard reads workflow files, not repo settings, so with no
#      SAST workflow present it scores the repo as having no SAST at all.
#
# Findings go to the Security tab. The job does not fail on findings - the
# branch ruleset's "require code scanning results" rule decides what blocks a
# merge, so severity policy lives in one place rather than two.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload SARIF
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan
        env:
          SEMGREP_IMAGE: semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 # 1.183.0
        run: |
          # Runs as the image's own user, not --user $(id -u): semgrep writes a
          # settings file to $HOME and a mapped-in uid has no home inside the
          # image. The SARIF lands in the mounted workspace as 0644, which is
          # all upload-sarif needs. --network host because the p/ configs are
          # fetched from the registry, and it keeps egress visible to
          # harden-runner instead of hiding it behind docker's NAT.
          docker run --rm \
            --network host \
            -v "$PWD":/src --workdir /src \
            "$SEMGREP_IMAGE" \
            semgrep scan \
            --config=p/default \
            --config=p/javascript \
            --config=p/python \
            --config=p/secrets \
            --config=p/github-actions \
            --exclude-rule=python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected \
            --sarif --output=semgrep.sarif \
            --metrics=off \
            --no-error
        # The excluded rule fires on agent/fetch.py, which exists to fetch URLs
        # that vary - it cannot not fire. What it warns about, urllib honouring
        # file:// and ftp://, is closed by an explicit scheme check in _get(),
        # and agent/fuzz.py asserts every non-HTTP scheme is refused on each CI
        # run. The in-source suppression showed as suppressed locally but still
        # surfaced as an alert, so the exclusion is declared here where it is
        # visible in review rather than buried in a comment.
        # --metrics=off: this repo's filenames and findings are nobody else's
        # business, least of all for a tool auditing its security posture.

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
