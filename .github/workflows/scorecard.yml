name: OpenSSF Scorecard

# Scores this repository against the OpenSSF supply-chain checks - pinned
# dependencies, branch protection, token permissions, dangerous workflow
# patterns - and publishes the result to the Security tab. Running it is the
# difference between claiming the repo is hardened and being able to show it.

on:
  branch_protection_rule:
  schedule:
    - cron: '23 5 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # publish the signed result
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        id: scorecard
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@b20883b0cd1f46c72ae0ba6d1090936928f9fa30 # v4.32.0
        with:
          sarif_file: results.sarif
