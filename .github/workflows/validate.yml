name: Validate

# This is the workflow that makes "the data is not broken" a *requireable* status
# check. The weekly ingest runs check.py too, but it only fires on a schedule, so
# it can never gate a pull request - which is exactly when a human is about to
# merge an agent's classifications.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install test and lint tooling (hash-verified)
        # A six-package closure: pytest, ruff and their three dependencies.
        # Small enough to read, which is the test for whether pinning a tool's
        # closure is worth the dependency surface it brings with it.
        run: pip install --require-hashes -r agent/dev-requirements.txt

      - name: Lint
        # ruff's config selects ALL and then removes specific rules with a
        # written reason each, so a new warning here is genuinely new.
        run: python3 -m ruff check agent/ tests/

      - name: Data files are valid JSON
        run: |
          for f in docs/data/*.json agent/sources.json; do
            python3 -c "import json,sys; json.load(open('$f'))" || { echo "invalid JSON: $f"; exit 1; }
          done

      - name: Referential integrity
        run: python3 agent/check.py

      - name: Derived data is current
        # A hand-edited papers.json with stale derived.json renders a dashboard
        # that quietly disagrees with itself. Recompute and fail if the result
        # differs from what was committed.
        run: |
          python3 agent/pipeline.py --derive-only >/dev/null
          if ! git diff --quiet -- docs/data/derived.json docs/data/gaps.json; then
            echo "::error::Derived data is stale. Run: python3 agent/pipeline.py --derive-only"
            git diff --stat -- docs/data/derived.json docs/data/gaps.json
            exit 1
          fi

      - name: Agent modules parse
        run: python3 -m compileall -q agent/

      - name: Dashboard script parses
        run: node --check docs/app.js

      - name: Test suite
        # Runs the end-to-end onboarding path (discovery, gate, validation,
        # merge, derive, gap reassessment - all with the model stubbed), the
        # parser fuzzer, and unit tests on the gate and the fetch boundary.
        # The expensive part of the weekly job is everything AFTER the model
        # answers, and this is what exercises it without spending a call.
        run: python3 -m pytest

      - name: Fuzz the untrusted-input parsers, harder
        # pytest runs 1200 cases to keep the suite quick; this is the deeper
        # run. The feed parser eats XML from the open internet, and an
        # unhandled exception there means no ingest and no deploy that week.
        run: python3 agent/fuzz.py 4000

      - name: Every action is pinned to a commit SHA
        # An unpinned action is a mutable dependency with write access to the
        # build. This also catches the failure that actually happened here: a
        # tag-to-SHA lookup returned empty and left a dangling @ in the file.
        #
        # Matches only real YAML keys at line start, not prose - an earlier
        # version of this check matched the example inside its own comment.
        run: |
          refs=$(grep -hE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*\S+' .github/workflows/*.yml \
                 | sed -E 's/^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*//; s/[[:space:]]*#.*$//' || true)
          bad=$(echo "$refs" | grep -v '^\./' | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Not pinned to a full commit SHA:"
            echo "$bad"
            exit 1
          fi
          echo "$(echo "$refs" | grep -c .) action refs, all SHA-pinned"

      - name: No inline style attributes in the page
        # The published CSP forbids them. Catching this here means a future edit
        # cannot silently blank the charts for every visitor.
        run: |
          if grep -n 'style="' docs/index.html docs/app.js; then
            echo "::error::Inline style attributes are blocked by the page CSP - use data-sty instead."
            exit 1
          fi
          echo "none found"
