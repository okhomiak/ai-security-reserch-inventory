name: Weekly research ingest

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour so we are not queued behind every other cron.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Recency window in days (default: the value in agent/sources.json)'
        required: false
        type: string
      limit:
        description: 'Cap how many candidates get classified this run'
        required: false
        type: string
      dry_run:
        description: 'Discover and gate only - make no API calls'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - run: pip install -r agent/requirements.txt

      - name: Run the pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL || 'claude-opus-5' }}
          CLASSIFIER_EFFORT: ${{ vars.CLASSIFIER_EFFORT || 'medium' }}
        run: |
          # GitHub runs `run:` under `bash -eo pipefail`, so a bare `[ ... ] && ...`
          # guard aborts the step whenever the test is false - which is every
          # scheduled run, where the dispatch inputs are empty. Use if-blocks.
          args=""
          if [ -n "${{ inputs.days }}" ];  then args="$args --days ${{ inputs.days }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then args="$args --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          python3 agent/pipeline.py $args 2>&1 | tee run.log

      - name: Check data integrity
        # Refuse to commit a broken inventory: a dangling id renders as a silently
        # broken link rather than an error, so it is caught here instead.
        run: python3 agent/check.py

      - name: Summarise the run
        if: always()
        run: |
          {
            echo '## Weekly ingest'
            echo
            if [ -f docs/data/runs.json ]; then
              python3 - <<'PY'
          import json
          r = json.load(open('docs/data/runs.json')).get('latest', {})
          u = r.get('usage', {})
          rows = [
            ('Mode', r.get('mode')), ('Discovered', r.get('discovered')),
            ('Gated out', r.get('gated_out')), ('Classified', r.get('classified')),
            ('Added to inventory', r.get('added')), ('Sent to review queue', r.get('queued')),
            ('Total papers', r.get('total_papers')), ('Seconds', r.get('seconds')),
            ('Tokens in / out', f"{u.get('input', 0)} / {u.get('output', 0)}"),
            ('Cache read tokens', u.get('cache_read', 0)),
          ]
          print('| | |'); print('|---|---|')
          for k, v in rows: print(f'| {k} | {v} |')
          if r.get('proposed_leaves'):
              print('\n**Proposed taxonomy leaves** (review before adding):\n')
              for p in r['proposed_leaves']:
                  print(f"- `{p['parent']}` › **{p['label']}** — {p['blurb']}")
          if r.get('errors'):
              print('\n**Errors**\n')
              for e in r['errors'][:10]: print(f'- {e}')
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the data
        id: commit
        run: |
          git config user.name  'research-inventory-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Separate adds: `git add a b` stages nothing at all if b is missing,
          # and last_dry_run.json only exists after a --dry-run.
          git add docs/data
          if [ -f agent/last_dry_run.json ]; then git add agent/last_dry_run.json; fi
          if git diff --cached --quiet; then
            echo 'no data changes'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            added=$(python3 -c "import json;print(json.load(open('docs/data/runs.json'))['latest'].get('added',0))")
            total=$(python3 -c "import json;print(json.load(open('docs/data/papers.json'))['count'])")
            git commit -m "data: weekly ingest (+${added} papers, ${total} total)"
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: run-log
          path: run.log
          retention-days: 30

  publish:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    # A push made with GITHUB_TOKEN does not trigger other workflows, so the
    # deploy is called explicitly rather than left to the push event.
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
