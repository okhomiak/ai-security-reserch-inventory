name: Weekly research ingest

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour so we are not queued behind every other cron.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Recency window in days (default: the value in agent/sources.json)'
        required: false
        type: string
      limit:
        description: 'Cap how many candidates get classified this run'
        required: false
        type: string
      dry_run:
        description: 'Discover and gate only - make no API calls'
        required: false
        type: boolean
        default: false

# Nothing by default. The single job below widens to exactly what it needs:
# a branch push and a pull request. It never needs write access to main.
permissions: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write        # push the ingest branch (not main - see branch protection)
      pull-requests: write   # open the PR
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          # The agent fetches from the open internet by design, so egress cannot
          # be blocked outright. Audit records every destination, which is how a
          # feed quietly redirecting elsewhere would be noticed.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies (hash-verified)
        # --require-hashes makes a substituted artifact fail the build rather
        # than execute. It also forces the full transitive closure to be pinned,
        # which is the point.
        run: pip install --require-hashes -r agent/requirements.txt

      - name: Run the pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL || 'claude-opus-5' }}
          CLASSIFIER_EFFORT: ${{ vars.CLASSIFIER_EFFORT || 'medium' }}
          # Dispatch inputs arrive through env, never through ${{ }} inside the
          # script. Expression substitution happens before bash parses the line,
          # so an interpolated input is shell *source*; an env var is just data.
          IN_DAYS: ${{ inputs.days }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          # GitHub runs `run:` under `bash -eo pipefail`, so a bare `[ ... ] && ...`
          # guard aborts the step whenever the test is false - which is every
          # scheduled run, where the dispatch inputs are empty. Use if-blocks.
          args=()
          if [ -n "$IN_DAYS" ];  then args+=(--days "$IN_DAYS"); fi
          if [ -n "$IN_LIMIT" ]; then args+=(--limit "$IN_LIMIT"); fi
          if [ "$IN_DRY" = "true" ]; then args+=(--dry-run); fi
          python3 agent/pipeline.py "${args[@]}" 2>&1 | tee run.log

      - name: Check data integrity
        # Refuse to commit a broken inventory: a dangling id renders as a silently
        # broken link rather than an error, so it is caught here instead.
        run: python3 agent/check.py

      - name: Summarise the run
        if: always()
        run: |
          {
            echo '## Weekly ingest'
            echo
            if [ -f docs/data/runs.json ]; then
              python3 - <<'PY'
          import json
          r = json.load(open('docs/data/runs.json')).get('latest', {})
          u = r.get('usage', {})
          rows = [
            ('Mode', r.get('mode')), ('Discovered', r.get('discovered')),
            ('Gated out', r.get('gated_out')), ('Classified', r.get('classified')),
            ('Added to inventory', r.get('added')), ('Sent to review queue', r.get('queued')),
            ('Total papers', r.get('total_papers')), ('Seconds', r.get('seconds')),
            ('Tokens in / out', f"{u.get('input', 0)} / {u.get('output', 0)}"),
            ('Cache read tokens', u.get('cache_read', 0)),
          ]
          print('| | |'); print('|---|---|')
          for k, v in rows: print(f'| {k} | {v} |')
          if r.get('proposed_leaves'):
              print('\n**Proposed taxonomy leaves** (review before adding):\n')
              for p in r['proposed_leaves']:
                  print(f"- `{p['parent']}` › **{p['label']}** — {p['blurb']}")
          if r.get('errors'):
              print('\n**Errors**\n')
              for e in r['errors'][:10]: print(f'- {e}')
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request with the data
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The agent never writes to main. It proposes a branch and a human
          # merges it, so every commit on main is attributable to a person who
          # looked at the diff - which is the point of running a security
          # inventory rather than just accumulating one.
          git config user.name  'okhomiak'
          git config user.email 'olegforvisa@gmail.com'

          git add docs/data
          if [ -f agent/last_dry_run.json ]; then git add agent/last_dry_run.json; fi

          if git diff --cached --quiet; then
            echo 'no data changes'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          added=$(python3 -c "import json;print(json.load(open('docs/data/runs.json'))['latest'].get('added',0))")
          queued=$(python3 -c "import json;print(json.load(open('docs/data/runs.json'))['latest'].get('queued',0))")
          total=$(python3 -c "import json;print(json.load(open('docs/data/papers.json'))['count'])")
          branch="ingest/$(date -u +%Y-%m-%d)"

          git checkout -b "$branch"
          git commit -m "data: weekly ingest (+${added} papers, ${total} total)"
          git push -f origin "$branch"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

          {
            echo "Automated weekly ingest. **Review the classifications before merging** - the"
            echo "agent judged provenance and category, and both are fallible."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Added to the inventory | ${added} |"
            echo "| Sent to the review queue | ${queued} |"
            echo "| Total papers | ${total} |"
            echo
            echo "Run log is attached as an artifact on the workflow run."
          } > /tmp/body.md

          gh pr create --base main --head "$branch" \
            --title "Weekly ingest: +${added} papers" \
            --body-file /tmp/body.md \
            --label automated 2>&1 | tail -2 \
            || gh pr edit "$branch" --body-file /tmp/body.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: run-log
          path: run.log
          retention-days: 30
