name: Deploy dashboard

# Actions are pinned to immutable commit SHAs, not tags. A tag is a mutable
# pointer: whoever controls the action repo can move v7 to new code and every
# consumer picks it up silently on the next run. Dependabot still proposes
# bumps - it rewrites the SHA and the trailing version comment together.

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Read-only by default; each job widens only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read     # checkout
      pages: write       # publish
      id-token: write    # OIDC for deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; don't leave a token in .git/config

      - name: Stamp assets with the commit SHA
        # GitHub Pages serves styles.css and app.js from the same URL on every
        # deploy, so a browser that cached them keeps the old ones - which is
        # exactly how a fixed CSS bug kept appearing unfixed. Stamping the
        # query string makes each deploy a new URL.
        run: |
          sha="${GITHUB_SHA::12}"
          sed -i -E "s#href=\"(styles|strata|strata-demand|strata-papers)\.css\"#href=\"\1.css?v=$sha\"#g; s|src=\"app.js\"|src=\"app.js?v=$sha\"|" docs/index.html
          grep -o -E '(styles|strata[a-z-]*)\.css\?v=[a-f0-9]*' docs/index.html
          grep -o 'app.js?v=[a-f0-9]*' docs/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
