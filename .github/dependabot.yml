version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    # Do not adopt a release the day it ships. A compromised version is most
    # dangerous in its first days, before anyone has looked at it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: [dependencies, github-actions]

  - package-ecosystem: pip
    directory: "/agent"
    schedule:
      interval: weekly
      day: tuesday
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: [dependencies, python]
